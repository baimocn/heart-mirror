<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>道德困惑墙 - 心镜</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        .dilemma-form {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .dilemma-form h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            transition: 0.2s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .options-container {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .option-item input {
            flex: 1;
        }

        .remove-option {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .remove-option:hover {
            background: #dc2626;
        }

        .add-option {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        .add-option:hover {
            background: #059669;
        }

        .anonymous-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .submit-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .dilemmas-list {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dilemmas-list h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .dilemma-item {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            transition: 0.2s;
        }

        .dilemma-item:hover {
            background: #f8fafc;
        }

        .dilemma-content {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .dilemma-options {
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option.voted {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .option-text {
            flex: 1;
        }

        .vote-count {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #475569;
        }

        .dilemma-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .anonymous-tag {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #475569;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-style: italic;
        }

        .back-btn {
            display: inline-block;
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-top: 30px;
        }

        .back-btn:hover {
            background: #334155;
            transform: translateY(-2px);
        }

        /* 字符计数样式 */
        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* 加载状态样式 */
        #listLoading {
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #475569;
        }

        .vote-loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 禁用状态样式 */
        .option.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 新添加的样式 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-sort {
            display: flex;
            gap: 10px;
        }

        .filter-sort select {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f8fafc;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .dilemma-item {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            transition: 0.2s;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #f8fafc;
        }

        .dilemma-item:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dilemma-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .dilemma-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .dilemma-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dilemma-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            background: #f1f5f9;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: #e2e8f0;
        }

        .action-btn.liked {
            background: #dbeafe;
            color: #3b82f6;
        }

        .action-btn.favorited {
            background: #fef3c7;
            color: #f59e0b;
        }

        .action-btn.followed {
            background: #d1fae5;
            color: #10b981;
        }

        .comments-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .comments-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .comment-form {
            margin-bottom: 20px;
        }

        .comment-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 10px;
        }

        .comment-form button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .comment-form button:hover {
            background: #2563eb;
        }

        .comment-item {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 10px;
            border-radius: 6px;
            background: white;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        .comment-content {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .comment-actions {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
        }

        .comment-action {
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }

        .comment-action:hover {
            color: #3b82f6;
        }

        .comment-action.liked {
            color: #3b82f6;
        }

        .reply-form {
            margin-top: 10px;
            margin-left: 20px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f8fafc;
        }

        .reply-form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 8px;
        }

        .reply-form button {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .reply-form button:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .dilemma-form,
            .dilemmas-list {
                padding: 20px;
            }

            .dilemma-item {
                padding: 15px;
            }

            .list-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .filter-sort {
                width: 100%;
                justify-content: space-between;
            }

            .filter-sort select {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤔 道德困惑墙</h1>
            <p class="subtitle">匿名分享你的道德困境，看看大家怎么选择</p>
        </header>

        <!-- 发布道德困惑表单 -->
        <div class="dilemma-form">
            <h2>📝 发布你的困惑</h2>
            <form id="dilemmaForm">
                <div class="form-group">
                    <label for="dilemmaContent">困惑内容</label>
                    <textarea id="dilemmaContent" placeholder="例如：你发现同事在工作中作弊，你会选择举报还是保持沉默？" maxlength="500"></textarea>
                    <div class="char-count">0/500</div>
                </div>

                <div class="form-group">
                    <label>选项（至少2个，最多5个）</label>
                    <div class="options-container" id="optionsContainer">
                        <div class="option-item">
                            <input type="text" placeholder="选项1" class="option-input" maxlength="100">
                            <button type="button" class="remove-option" onclick="removeOption(this)">删除</button>
                        </div>
                        <div class="option-item">
                            <input type="text" placeholder="选项2" class="option-input" maxlength="100">
                            <button type="button" class="remove-option" onclick="removeOption(this)">删除</button>
                        </div>
                    </div>
                    <button type="button" class="add-option" onclick="addOption()">+ 添加选项</button>
                </div>

                <div class="anonymous-checkbox">
                    <input type="checkbox" id="anonymousCheck" checked>
                    <label for="anonymousCheck">匿名发布</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">发布困惑</span>
                    <span id="submitLoading" style="display: none;">发布中...</span>
                </button>
            </form>
        </div>

        <!-- 道德困惑列表 -->
        <div class="dilemmas-list">
            <div class="list-header">
                <h2>💡 大家的困惑</h2>
                <div id="listLoading" style="display: none;">加载中...</div>
            </div>
            <div id="dilemmasList">
                <!-- 道德困惑将通过JavaScript动态生成 -->
            </div>
        </div>

        <a href="/" class="back-btn">返回首页</a>
    </div>

    <script>
        // 设备ID生成函数
        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = 'device_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('deviceId', id);
            }
            return id;
        }

        // 已投票记录管理
        function getVotedDilemmas() {
            return JSON.parse(localStorage.getItem('voted_dilemmas') || '{}');
        }

        function setVotedDilemma(dilemmaId) {
            const votedDilemmas = getVotedDilemmas();
            votedDilemmas[dilemmaId] = true;
            localStorage.setItem('voted_dilemmas', JSON.stringify(votedDilemmas));
        }

        function hasVoted(dilemmaId) {
            const votedDilemmas = getVotedDilemmas();
            return !!votedDilemmas[dilemmaId];
        }

        // 时间格式化函数
        function formatTime(timestamp) {
            const now = new Date();
            const past = new Date(timestamp);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) {
                return '刚刚';
            } else if (diffInSeconds < 3600) {
                return `${Math.floor(diffInSeconds / 60)}分钟前`;
            } else if (diffInSeconds < 86400) {
                return `${Math.floor(diffInSeconds / 3600)}小时前`;
            } else if (diffInSeconds < 604800) {
                return `${Math.floor(diffInSeconds / 86400)}天前`;
            } else {
                return past.toLocaleDateString('zh-CN');
            }
        }

        // API调用函数
        async function fetchDilemmas() {
            try {
                const response = await fetch('/api/dilemmas');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return Array.isArray(data) ? data : [];
            } catch (error) {
                console.error('获取困惑列表失败', error);
                // 模拟数据，用于测试
                return [
                    {
                        id: 1,
                        content: '你发现同事在工作中作弊，你会选择举报还是保持沉默？',
                        options: ['举报', '保持沉默', '私下沟通'],
                        votes: [10, 5, 3],
                        is_anonymous: 1,
                        created_at: new Date().toISOString()
                    },
                    {
                        id: 2,
                        content: '如果你的朋友向你借钱但你知道他可能不会还钱，你会借给他吗？',
                        options: ['借给他', '不借给他', '借一部分'],
                        votes: [8, 12, 5],
                        is_anonymous: 0,
                        created_at: new Date(Date.now() - 3600000).toISOString()
                    }
                ];
            }
        }

        async function createDilemma(content, options, isAnonymous) {
            try {
                const response = await fetch('/api/dilemmas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: getDeviceId(),
                        title: content.substring(0, 50) + (content.length > 50 ? '...' : ''),
                        content,
                        options,
                        is_anonymous: isAnonymous ? 1 : 0
                    })
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                return {
                    success: !result.error,
                    data: result.id ? { id: result.id } : null,
                    error: result.error
                };
            } catch (error) {
                console.error('发布困惑失败', error);
                // 模拟成功响应
                return {
                    success: true,
                    data: { id: Date.now() }
                };
            }
        }

        async function voteDilemmaApi(dilemmaId, optionIndex) {
            try {
                const response = await fetch(`/api/dilemmas/${dilemmaId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ option_index: optionIndex })
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                return {
                    success: !result.error,
                    error: result.error
                };
            } catch (error) {
                console.error('投票失败', error);
                // 模拟成功响应
                return {
                    success: true
                };
            }
        }

        // 加载道德困惑列表
        async function loadDilemmas() {
            const loadingElement = document.getElementById('listLoading');
            const container = document.getElementById('dilemmasList');
            
            loadingElement.style.display = 'block';
            
            try {
                const dilemmas = await fetchDilemmas();
                // 按created_at倒序排列
                dilemmas.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                renderDilemmas(dilemmas);
            } catch (error) {
                console.error('加载道德困惑失败', error);
                container.innerHTML = '<div class="empty-message">加载失败，请稍后重试</div>';
            } finally {
                loadingElement.style.display = 'none';
            }
        }

        // 渲染道德困惑列表
        function renderDilemmas(dilemmas) {
            const container = document.getElementById('dilemmasList');
            
            if (dilemmas.length === 0) {
                container.innerHTML = '<div class="empty-message">还没有道德困惑，不如做第一个分享的人</div>';
                return;
            }

            let html = '';
            dilemmas.forEach(dilemma => {
                const voted = hasVoted(dilemma.id);
                let optionsHtml = '';
                dilemma.options.forEach((option, index) => {
                    const isVoted = voted;
                    optionsHtml += `
                        <div class="option ${isVoted ? 'voted disabled' : ''}" onclick="${voted ? '' : `handleVote(${dilemma.id}, ${index}, this)`}">
                            <div class="option-text">${option}</div>
                            <div class="vote-count">${dilemma.votes[index] || 0} 票</div>
                        </div>
                    `;
                });

                html += `
                    <div class="dilemma-item" data-id="${dilemma.id}">
                        <div class="dilemma-content">${dilemma.content}</div>
                        <div class="dilemma-options">
                            ${optionsHtml}
                        </div>
                        <div class="dilemma-meta">
                            <span>${formatTime(dilemma.created_at)}</span>
                            ${dilemma.is_anonymous ? '<span class="anonymous-tag">匿名发布</span>' : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 处理投票
        async function handleVote(dilemmaId, optionIndex, element) {
            if (hasVoted(dilemmaId)) {
                alert('你已经为这个道德困境投过票了');
                return;
            }

            // 添加加载状态
            const optionElements = element.parentElement.querySelectorAll('.option');
            optionElements.forEach(opt => opt.classList.add('vote-loading'));

            try {
                const result = await voteDilemmaApi(dilemmaId, optionIndex);
                if (result.success) {
                    // 记录已投票
                    setVotedDilemma(dilemmaId);
                    // 重新加载列表
                    await loadDilemmas();
                } else {
                    alert('投票失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('投票失败', error);
                alert('投票失败，请稍后重试');
            } finally {
                // 移除加载状态
                optionElements.forEach(opt => opt.classList.remove('vote-loading'));
            }
        }

        // 发布道德困惑
        async function submitDilemma() {
            const content = document.getElementById('dilemmaContent').value.trim();
            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs).map(input => input.value.trim()).filter(value => value);
            const isAnonymous = document.getElementById('anonymousCheck').checked;
            
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitLoading = document.getElementById('submitLoading');

            // 表单验证
            if (!content) {
                alert('请描述你的道德困境');
                return;
            }

            if (options.length < 2) {
                alert('至少需要2个选项');
                return;
            }

            if (options.length > 5) {
                alert('最多只能有5个选项');
                return;
            }

            // 显示加载状态
            submitText.style.display = 'none';
            submitLoading.style.display = 'inline';
            submitBtn.disabled = true;

            try {
                const result = await createDilemma(content, options, isAnonymous);
                if (result.success) {
                    alert('发布成功！');
                    // 清空表单
                    document.getElementById('dilemmaContent').value = '';
                    document.getElementById('anonymousCheck').checked = true;
                    document.getElementById('optionsContainer').innerHTML = `
                        <div class="option-item">
                            <input type="text" placeholder="选项1" class="option-input" maxlength="100">
                            <button type="button" class="remove-option" onclick="removeOption(this)">删除</button>
                        </div>
                        <div class="option-item">
                            <input type="text" placeholder="选项2" class="option-input" maxlength="100">
                            <button type="button" class="remove-option" onclick="removeOption(this)">删除</button>
                        </div>
                    `;
                    // 重新加载列表
                    await loadDilemmas();
                } else {
                    alert('发布失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('发布道德困惑失败', error);
                alert('发布失败，请稍后重试');
            } finally {
                // 恢复按钮状态
                submitText.style.display = 'inline';
                submitLoading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // 添加选项
        function addOption() {
            const container = document.getElementById('optionsContainer');
            if (container.children.length >= 5) {
                alert('最多只能添加5个选项');
                return;
            }
            
            const optionCount = container.children.length + 1;
            const optionItem = document.createElement('div');
            optionItem.className = 'option-item';
            optionItem.innerHTML = `
                <input type="text" placeholder="选项${optionCount}" class="option-input" maxlength="100">
                <button type="button" class="remove-option" onclick="removeOption(this)">删除</button>
            `;
            container.appendChild(optionItem);
        }

        // 删除选项
        function removeOption(button) {
            const optionItem = button.closest('.option-item');
            const container = document.getElementById('optionsContainer');
            if (container.children.length > 2) {
                optionItem.remove();
                // 更新选项编号
                const optionInputs = document.querySelectorAll('.option-input');
                optionInputs.forEach((input, index) => {
                    input.placeholder = `选项${index + 1}`;
                });
            } else {
                alert('至少需要2个选项');
            }
        }

        // 字符计数
        document.getElementById('dilemmaContent').addEventListener('input', function() {
            const charCount = this.value.length;
            const charCountElement = this.nextElementSibling;
            charCountElement.textContent = `${charCount}/500`;
        });

        // 提交表单
        document.getElementById('dilemmaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            submitDilemma();
        });

        // 初始化
        loadDilemmas();
    </script>
</body>
</html>
